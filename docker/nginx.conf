# Static-site config for the built Vite app. No app server, no proxying —
# CapRover terminates TLS and reverse-proxies to this container's port 80.
#
# NOTE: this /health route is for manual checks only (curl from the host, or a
# separate non-CapRover Swarm stack deploy of this same image). Do NOT wire it
# up as a Docker HEALTHCHECK in the Dockerfile — CapRover already does its own
# HTTP readiness probe against the configured Container HTTP Port, and a
# second, Docker-level HEALTHCHECK on top of that has been observed to fight
# CapRover's deploy-wait logic and loop the service through constant restarts.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints build output (e.g. assets/main.abc123.js), so those
    # files are safe to cache forever — a new build gets new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must always be revalidated, or a deploy can leave
    # clients pointing at asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
